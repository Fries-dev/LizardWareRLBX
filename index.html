<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Your Key</title>
  <style>
    body { background:#111; color:#fff; font-family:sans-serif; text-align:center; padding-top:15vh; }
    code { display:block; margin:20px auto; padding:14px; background:#222; max-width:480px; word-break:break-all; }
    button { padding:10px 20px; border:0; border-radius:6px; background:#3c5ac8; color:#fff; cursor:pointer; }
  </style>
</head>
<body>
  <h2>Your key</h2>
  <code id="key">Loading...</code>
  <button onclick="navigator.clipboard.writeText(document.getElementById('key').textContent)">Copy</button>
  <script>
    const p = new URLSearchParams(location.search);
    const t = p.get("token") || p.get("wrdtoken");
    document.getElementById("key").textContent = t || "No token found. Complete the link first.";
  </script>
</body>
</html>
